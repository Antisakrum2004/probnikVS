services:
    web:
        image: jitsi/web:${JITSI_IMAGE_VERSION:-unstable}
        restart: ${RESTART_POLICY:-unless-stopped}
        ports:
            - '${HTTP_PORT}:80'
            - '${HTTPS_PORT}:443'
        volumes:
            - ${CONFIG}/web:/config:Z
            - ${CONFIG}/web/crontabs:/var/spool/cron/crontabs:Z
            - ${CONFIG}/transcripts:/usr/share/jitsi-meet/transcripts:Z
            - ${CONFIG}/web/load-test:/usr/share/jitsi-meet/load-test:Z
        labels:
            service: "jitsi-web"
        environment:
            - AUDIO_QUALITY_OPUS_BITRATE
            - ENABLE_AUTH
            - ENABLE_GUESTS
            - TOKEN_AUTH_URL
            - TZ

    prosody:
        image: jitsi/prosody:${JITSI_IMAGE_VERSION:-unstable}
        restart: ${RESTART_POLICY:-unless-stopped}

    jicofo:
        image: jitsi/jicofo:${JITSI_IMAGE_VERSION:-unstable}

    jvb:
        image: jitsi/jvb:${JITSI_IMAGE_VERSION:-unstable}
        ports:
            - '${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp'

    # ==========================================
    #  PHP Middleware — расширенный token-api
    # ==========================================
    token-api:
        image: php:8.2-apache
        container_name: jitsi-token-api
        restart: ${RESTART_POLICY:-unless-stopped}
        networks:
            - meet.jitsi
        ports:
            - "58080:80"
        volumes:
            - ./token-api:/var/www/html
        environment:
            # Конфигурация передаётся через .env
            - EMAI_API_URL=https://emai-dev.comprog.art/api/gateway
            - EMAI_API_KEY=emai_dev_7f3a9c2e4b8d1a5f6c0e9b2d7a4f1c8e
            - JITSI_APP_ID=test_jitsi_app_id
            - JITSI_APP_SECRET=test_jitsi_app_secret
            - JITSI_DOMAIN=msi-2.dialog.ip:58443

networks:
    meet.jitsi:
