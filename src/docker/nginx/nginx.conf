# =============================================================
#  Nginx — Reverse Proxy для Jitsi Meet
#  SSL termination + proxy_pass на Jitsi Web
# =============================================================

events {
    worker_connections 1024;
}

http {
    # Логи
    access_log /var/log/nginx/jitsi_access.log;
    error_log  /var/log/nginx/jitsi_error.log;

    # Общий таймаут
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # -----------------------------------------------
    #  HTTP — redirect на HTTPS
    # -----------------------------------------------
    server {
        listen 80;
        server_name msi-2.dialog.ip;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------------------------
    #  HTTPS — основной сервер Jitsi
    # -----------------------------------------------
    server {
        listen 443 ssl http2;
        server_name msi-2.dialog.ip;

        # SSL (заменить пути на ваши сертификаты)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Протоколы
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # WebRTC нужны большие заголовки (BOSH/WebSocket)
        large_client_header_buffers 4 32k;

        # -------------------------------------------
        #  Jitsi Meet Web UI
        # -------------------------------------------
        location / {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------
        #  HTTP Bind (BOSH для XMPP)
        # -------------------------------------------
        location /http-bind {
            proxy_pass http://prosody:5280/http-bind;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------
        #  WebSocket (XMPP через WebSocket)
        # -------------------------------------------
        location /xmpp-websocket {
            proxy_pass http://prosody:5280/xmpp-websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------
        #  Colibri (JVB REST API)
        # -------------------------------------------
        location /colibri-ws/ {
            proxy_pass http://jvb:9090/colibri-ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Статика
        location ~ ^/(css|fonts|img|js|sounds|static|images)/ {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
            expires 30d;
        }
    }
}

# -----------------------------------------------
#  Stream — TCP для видеопотока (colibri)
# -----------------------------------------------
stream {
    upstream colibri {
        server jvb:9090;
    }

    server {
        listen 4443;
        proxy_pass colibri;
        proxy_timeout 1h;
    }
}
